# hyprland.conf — translated from macos aerospace.toml.
# HOST-SIDE config (Bazzite/SteamOS desktop). NOT stowed by install-arch.sh
# (that targets the distrobox). Stow on the host: stow -d ~/gyatfiles -t ~ hyprland
#
# Primary mod = ALT, to preserve aerospace muscle memory 1:1.
$mod = ALT

################################################################################
# Monitors — host-specific. Aerospace pinned workspaces to mac displays
# (Studio Display / Dell / built-in); those names don't exist on Linux.
# Run `hyprctl monitors` and set real names below. Defaults to auto-layout.
################################################################################
monitor = , preferred, auto, 1

# Per-monitor workspace pinning (aerospace workspace-to-monitor-force-assignment).
# GAP: mac monitor names replaced with placeholders — edit after `hyprctl monitors`.
# workspace = name:Private, monitor:eDP-1
# workspace = name:Entertainment, monitor:eDP-1
# workspace = name:Messages, monitor:DP-1
# workspace = name:Notes, monitor:DP-1

################################################################################
# Look & feel — eye candy aerospace/borders can't do.
# Colors from themes/vector: active cyan 0x22d3ee, accent violet 0xb18aff.
################################################################################
general {
    gaps_in = 15
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(22d3eeff) rgba(b18affff) 45deg
    col.inactive_border = rgba(1a1a2aaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a2aee)
    }
    active_opacity = 1.0
    inactive_opacity = 0.96
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 5, smooth, popin 80%
    animation = fade, 1, 6, smooth
    animation = workspaces, 1, 5, smooth, slide
    animation = border, 1, 8, smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}

################################################################################
# App launchers (aerospace alt-<key> exec-and-forget). Linux binaries.
################################################################################
bind = $mod, grave,     exec, ghostty
bind = $mod, o,         exec, obsidian
bind = $mod, b,         exec, firefox
bind = $mod, s,         exec, slack

################################################################################
# Window / layout ops
################################################################################
bind = $mod, backspace,     killactive          # alt-backspace close
bind = $mod, slash,         togglesplit         # alt-slash tiles h/v toggle
bind = $mod, comma,         togglegroup         # alt-comma accordion ~= tabbed group
bind = $mod, f,             togglefloating      # alt-f float toggle
bind = $mod, space,         fullscreen, 0       # alt-space fullscreen

# Focus (alt-hjkl)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Move window (alt-shift-hjkl)
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Resize. Aerospace "resize smart" adjusts the split-relevant axis; Hyprland has
# no smart axis, so these resize width. binde = repeat-on-hold.
binde = $mod,       t, resizeactive, -150 0
binde = $mod,       y, resizeactive,  150 0
binde = $mod SHIFT, t, resizeactive, -100 0
binde = $mod SHIFT, y, resizeactive,  100 0
binde = $mod CTRL,  t, resizeactive,  -50 0
binde = $mod CTRL,  y, resizeactive,   50 0

# Multi-monitor
bind = $mod CTRL, tab,   focusmonitor, +1       # alt-ctrl-tab next monitor
bind = $mod, tab,        workspace, previous     # alt-tab back-and-forth
bind = $mod SHIFT, tab,  movewindow, mon:+1      # alt-shift-tab move to next monitor
bind = $mod CTRL, x,     movecurrentworkspacetomonitor, +1  # alt-ctrl-x

# Move window to monitor in direction + follow (alt-ctrl-hjkl)
bind = $mod CTRL, h, movewindow, mon:l
bind = $mod CTRL, j, movewindow, mon:d
bind = $mod CTRL, k, movewindow, mon:u
bind = $mod CTRL, l, movewindow, mon:r

bind = $mod CTRL SHIFT, r, exec, hyprctl reload  # alt-ctrl-shift-r reload

################################################################################
# Named workspaces (aerospace workspaces). alt-<key> focus, alt-shift-<key> move+follow.
################################################################################
bind = $mod, x, workspace, name:Scratch
bind = $mod, m, workspace, name:Messages
bind = $mod, v, workspace, name:Meetings
bind = $mod, c, workspace, name:Code
bind = $mod, n, workspace, name:Notes
bind = $mod, d, workspace, name:Design
bind = $mod, w, workspace, name:Web
bind = $mod, e, workspace, name:Entertainment
bind = $mod, p, workspace, name:Private

bind = $mod SHIFT, x, movetoworkspace, name:Scratch
bind = $mod SHIFT, m, movetoworkspace, name:Messages
bind = $mod SHIFT, v, movetoworkspace, name:Meetings
bind = $mod SHIFT, c, movetoworkspace, name:Code
bind = $mod SHIFT, n, movetoworkspace, name:Notes
bind = $mod SHIFT, d, movetoworkspace, name:Design
bind = $mod SHIFT, w, movetoworkspace, name:Web
bind = $mod SHIFT, e, movetoworkspace, name:Entertainment
bind = $mod SHIFT, p, movetoworkspace, name:Private

# Mouse drag (float move/resize) — not in aerospace, standard hypr QoL.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

################################################################################
# Service submap (aerospace mode.service). alt-shift-semicolon to enter.
# GAP: aerospace `flatten-workspace-tree` and `close-all-windows-but-current`
# have no dwindle equivalent — only reload ports.
################################################################################
bind = $mod SHIFT, semicolon, submap, service
submap = service
bind = , escape,    exec, hyprctl reload
bind = , escape,    submap, reset
bind = , r,         submap, reset
submap = reset

################################################################################
# Window rules (aerospace on-window-detected). Case-insensitive class match.
# mac-only apps dropped (Xcode, Photo Booth, Zwift, Simulator, Finder, Messages.app).
################################################################################
# Floating apps
windowrulev2 = float, class:(?i)(1password|docker|vial|chatgpt|pritunl)
windowrulev2 = float, title:(?i)(settings|install)

# Entertainment
windowrulev2 = workspace name:Entertainment, class:(?i)(spotify)
windowrulev2 = workspace name:Entertainment, title:(?i)(soundcloud|music)
# Selene game-streaming client: floating, fixed size, Entertainment.
windowrulev2 = float, class:(?i)(selene)
windowrulev2 = workspace name:Entertainment, class:(?i)(selene)

# Web
windowrulev2 = workspace name:Web, class:(?i)(firefox|chrome|chromium|brave)

# Notes / Design
windowrulev2 = workspace name:Notes, class:(?i)(obsidian)
windowrulev2 = workspace name:Design, title:(?i)(figma)

# Code
windowrulev2 = workspace name:Code, class:(?i)(jetbrains|intellij|zed|code|ghostty|wezterm)

# Messages / Meetings
windowrulev2 = workspace name:Messages, class:(?i)(slack|discord|whatsapp)
windowrulev2 = workspace name:Meetings, title:(?i)(google meet|google calendar)

################################################################################
# GAPS (named honestly, per repo rules):
#  - exec-on-workspace-change=pippin.sh: macOS PIP-window herding via aerospace
#    CLI. No Linux port; PIP handling differs. Skipped.
#  - startup "move everything to Web": aerospace during-startup rule. Skipped;
#    set a default with `bind`/exec-once if wanted.
#  - join-with (manual container tree): dwindle auto-splits, no equivalent.
#  - macos-native-minimize (cmd-h): no minimize in hypr tiling. Skipped.
################################################################################

# ── Hotkeys ─────────────────────────────────────────────────────────────
# Aerospace mapping:
#   alt+c → workspace Code (1)      alt+shift+c → move to Code (1)
#   alt+w → workspace Web (2)       alt+shift+w → move to Web (2)
#   alt+m → workspace Messages (3)  alt+shift+m → move to Messages (3)
#   alt+n → workspace Notes (4)     alt+shift+n → move to Notes (4)
#   alt+v → workspace Meetings (5)  alt+shift+v → move to Meetings (5)
#   alt+d → workspace Design (6)    alt+shift+d → move to Design (6)
#   alt+e → workspace Entertain (7) alt+shift+e → move to Entertain (7)
#   alt+p → workspace Private (8)   alt+shift+p → move to Private (8)
#   alt+x → workspace Scratch (9)   alt+shift+x → move to Scratch (9)


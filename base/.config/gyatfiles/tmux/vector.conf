# ─── VECTOR — terminal-neon theme for tmux ───────────────────────────────────
# Part of the VECTOR//OS family (Selene / Helios / Vector). Sourced from the
# OS override confs AFTER TPM runs, so everything here wins over catppuccin's
# defaults without touching the plugin. Palette is hardcoded hex (style options
# don't reliably expand #{@...} across tmux versions); scripts carry the same
# values — grep VECTOR-PALETTE to find every copy when retuning.
#
# VECTOR-PALETTE
#   bg        #0a0e17   deep blue-black (popup fill)
#   panel     #0d1a26   active-tab fill (cyan family)
#   grid      #1a2332   hairlines / inactive borders
#   dim       #3d4f6b   idle window tabs, hints
#   text      #5a7290   secondary text
#   cyan      #22d3ee   WINDOWS channel + active pane border
#   red       #ff5d73   SESSIONS channel (active)
#   red_bg    #2a1018   active session fill
#   red_dim   #a05468   SESSIONS channel (inactive)
#   amber     #f0b429   MACHINE channel (host pill, SSH picker frame)
#   green     #34d399   sys up
#   blue      #60a5fa   SSH segment
#   pink      #e879a0   context meter
#
# Channel logic: color = row meaning. Cyan strip = windows, crimson rail =
# sessions, amber = this machine, green/red = health. Active state is always
# the same grammar in both rows: bold + background fill + colored underline
# (underline color needs the Setulc terminal-override — already set in
# .tmux.conf; Ghostty and kitty support it, Terminal.app degrades to plain).

# ─── Window tabs: dim when idle, cyan + fill + underline when current ────────
set -g window-status-separator ""
set -g window-status-style "fg=#3d4f6b,bg=default"
set -g window-status-format "  #I·#W  "
set -g window-status-current-style "fg=#22d3ee,bg=#0d1a26,bold,underscore,us=#22d3ee"
set -g window-status-current-format "  #I·#W  "
set -g window-status-activity-style "fg=#f0b429,bg=default"
set -g window-status-bell-style "fg=#ff5d73,bg=default,bold"

# ─── Status chrome ────────────────────────────────────────────────────────────
# The bar sits on void — one layer below the terminal bg — so fills read as
# raised buttons and the rail reads as chrome, not floating text.
set -g status-style "bg=#05080f,fg=#5a7290"
set -g status-justify left
set -g status-left ""
set -g status-right ""

# ─── Messages / command prompt / copy-mode ───────────────────────────────────
set -g message-style "fg=#22d3ee,bg=#0d1a26"
set -g message-command-style "fg=#f0b429,bg=#0d1a26"
set -g mode-style "fg=#0a0e17,bg=#22d3ee"

# ─── Panes ───────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#1a2332"
set -g pane-active-border-style "fg=#22d3ee"

# ─── Popups (tmux >= 3.3): rounded frames, Vector fill ───────────────────────
# Per-picker border colors are passed at launch (-S): crimson = sessions,
# amber = uplink/SSH, red = vpn/aws remediation.
set -g popup-border-lines rounded
set -g popup-style "bg=#0a0e17"
set -g popup-border-style "fg=#1a2332"

# ─── Clock ───────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#22d3ee"

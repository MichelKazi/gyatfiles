# ─── SteamOS / Steam Deck tmux overrides ─────────────────────────────────────
# Sourced from .tmux.conf via `uname` detection (after TPM, so vector.conf
# below cleanly overrides catppuccin's window/status styling).

# ─── Theme: Vector ───────────────────────────────────────────────────────────
source-file ~/gyatfiles/themes/vector/tmux/vector.conf

# Window rename: plain basename (tmux-window-name helper is macOS-only)
set-option -g automatic-rename-format '#{b:pane_current_path}'

# No continuum-boot on SteamOS -- systemd handles session persistence

# ─── Status rail ─────────────────────────────────────────────────────────────
# Two rows, same shape as the mac: [0] window tabs, [1] Vector rail. The rail
# now uses vector-sessions.sh (one subprocess per interval — the old pure
# #{S:...} loop couldn't do bracket labels, fleet ◆ marks, or width-responsive
# compact mode). No VPN/AWS on the Deck; sys-status.sh auto-detects and shows
# only the SSH segment.
set -g status 2

# Row 0: window tabs (styling lives in vector.conf window-status-*).
set -g status-format[0] "#[align=left]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}"

# Row 1: [ DECK ] machine pill (amber, range=menu -> picker) + sessions +
# right-aligned CTX meter + sys cluster (SSH only on the Deck).
set -g status-format[1] "#[align=left]#[range=user|menu]#[fg=#f0b429,bold] [ DECK ] #[norange]#[default] #(~/.local/share/tmux/vector-sessions.sh '#{client_session}' '#{client_width}')#[align=right]#(~/.local/share/tmux/vector-ctx.sh)#(~/.local/share/tmux/sys-status.sh '#{client_width}') "

# ─── Click handlers for status bar ───────────────────────────────────────────
# Session segments switch via the @clicked_range + session-switch.sh seam
# (see .tmux.macos.conf for the full why); menu opens the Vector picker.
bind-key -n MouseDown1Status \
  if-shell -F '#{m:sess_*,#{mouse_status_range}}' \
    'set -gF @clicked_range "#{mouse_status_range}" ; run-shell "~/.local/share/tmux/session-switch.sh"' \
    { if-shell -F '#{==:#{mouse_status_range},menu}' \
        'run-shell "~/.local/share/tmux/session-picker.sh"' \
        { if-shell -F '#{==:#{mouse_status_range},ssh}' \
            'display-popup -E -w 60% -h 60% -b rounded -S "fg=#f0b429" -T " VECTOR//UPLINK " "~/.local/share/tmux/ssh-picker.sh"' \
            'select-window -t=' } }

# SSH picker keybind (prefix + S) matches the click-launched frame.
bind S display-popup -E -w 60% -h 60% -b rounded -S "fg=#f0b429" -T " VECTOR//UPLINK " "~/.local/share/tmux/ssh-picker.sh"

# ─── Mobile override: single row when on Moshi ───────────────────────────────
# Row COUNT is a session option and can't vary per client, so Moshi keeps its
# env-var hook to drop to one row. Row CONTENT is already responsive via
# #{client_width} — the session segment collapses to [ CURRENT ▾ ] +N (tap
# opens the picker) and sys to dots, so this override only merges the rows.
if-shell '[ "$MOSHI_CLIENT" = "1" ]' {
  set -g status 1
  set -g status-format[0] "#[align=left]#(~/.local/share/tmux/vector-sessions.sh '#{client_session}' '#{client_width}')#[align=centre]#[fg=#22d3ee,bold] #I#[fg=#3d4f6b]/#{session_windows} #[align=right]#(~/.local/share/tmux/sys-status.sh '#{client_width}') "
}

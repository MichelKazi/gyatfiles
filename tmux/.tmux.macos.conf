# ─── macOS-specific tmux overrides ───────────────────────────────────────────
# Sourced from .tmux.conf via `uname` detection (after TPM, so vector.conf
# below cleanly overrides catppuccin's window/status styling).

# ─── Theme: Vector ───────────────────────────────────────────────────────────
source-file ~/gyatfiles/tmux/vector.conf

# Window rename via tmux-window-name helper (macOS pip tool)
set-option -g automatic-rename-format '#(tmux-window-name "#{pane_current_path}")#{b:pane_current_path}'

# Persist tmux across reboots into ghostty (launchd)
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'ghostty'

# ─── Status rail ─────────────────────────────────────────────────────────────
# Two rows: [0] window tabs, [1] Vector rail: [ MAC ] + sessions + right-aligned
# [ AWS ] status (green up / crimson down, tap to re-auth) + rotating metrics.
#
# Formats expand PER CLIENT, so '#{client_width}' makes the rail responsive:
# under 80 cols (Moshi) the session script collapses to [ CURRENT ▾ ] +N.
set -g status 2

# Row 0: window tabs (styling lives in vector.conf window-status-*).
set -g status-format[0] "#[align=left]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}"

# Row 1: the Vector rail. [ MAC ] is the machine pill (amber, range=menu ->
# session picker); sessions render via vector-sessions.sh (crimson channel);
# right side is the rotating metrics ticker (agents / uptime / week tokens,
# 稼働/起動/消費, per-metric channel color) then Tailscale status (personal
# fleet), pinned right of the ticker so it stays in a fixed spot.
# Work VPN/cloud segments (WARP, AWS) are layered on by .tmux.work.conf, sourced
# at the bottom of this file — kept out of the shared dotfiles repo.
set -g status-format[1] "#[align=left]#[range=user|menu]#{?client_prefix,#[bg=#f0b429]#[fg=#05080f]#[bold],#[fg=#f0b429]#[bold]} MAC #[norange]#[default] #(~/.local/share/tmux/vector-sessions.sh '#{client_session}' '#{client_width}')#[align=right]#(~/.local/share/tmux/vector-metrics.sh)  #(~/.local/share/tmux/ts-status.sh) "

# ─── Click handlers for status bar ───────────────────────────────────────────
# Clicking a session segment (range sess_<name>) switches DIRECTLY to that
# session. We stash the clicked range in @clicked_range with `set -gF` (the -F
# flag EXPANDS the format at write time; plain `set -g` stored the literal
# "#{mouse_status_range}", the bug behind "no session"), then session-switch.sh
# reads it in a real shell and switches. Doing the strip+switch inline failed
# every way: switch-client -t doesn't expand #{...} in its target, and a nested
# run-shell inside if-shell passed the literal #{...} to the shell. The script
# is the reliable seam. [ MAC ] (range menu) opens the sessions picker — and so
# does the compact [ CURRENT ▾ ] segment on narrow clients. Popups carry the
# Vector frames: crimson = sessions, amber = uplink.
# Work ranges (warp-down, aws-down) are added by .tmux.work.conf, which
# re-defines this whole binding (tmux allows only one handler per key).
bind-key -n MouseDown1Status \
  if-shell -F '#{m:sess_*,#{mouse_status_range}}' \
    'set -gF @clicked_range "#{mouse_status_range}" ; run-shell "~/.local/share/tmux/session-switch.sh"' \
    { if-shell -F '#{==:#{mouse_status_range},menu}' \
        'run-shell "~/.local/share/tmux/session-picker.sh"' \
        { if-shell -F '#{==:#{mouse_status_range},ssh}' \
            'display-popup -E -w 60% -h 60% -b rounded -S "fg=#f0b429" -T " VECTOR//通信 " "~/.local/share/tmux/ssh-picker.sh"' \
            'select-window -t=' } }

# SSH picker keybind (prefix + S) matches the click-launched frame.
bind S display-popup -E -w 60% -h 60% -b rounded -S "fg=#f0b429" -T " VECTOR//通信 " "~/.local/share/tmux/ssh-picker.sh"

# ─── Work overrides (Strava) ─────────────────────────────────────────────────
# Sourced last so it can override the rail + click handler. -q = silent when the
# file is absent (personal machines), keeping this base config machine-agnostic.
# The file is gitignored; see tmux/.tmux.work.conf.example for the template.
source-file -q ~/gyatfiles/tmux/.tmux.work.conf

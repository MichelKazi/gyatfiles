# ─── Terminal capabilities ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ─── Settings ────────────────────────────────────────────────────────────────
set -sg escape-time 0
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g history-limit 100000
set -g mouse on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#S:#I #W"
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename on
# automatic-rename-format is OS-specific (see sourced override at bottom)

# Pass Moshi env var through to new panes/windows
set-option -ga update-environment " MOSHI_CLIENT"

# ─── Plugins ─────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'omerxx/tmux-sessionx'

# sessionx config
set -g @sessionx-bind 'O'
set -g @sessionx-window-mode 'on'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '80%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'

set -g @continuum-restore 'on'
# continuum-boot is OS-specific (macOS only; see override)

# ─── Theme: Catppuccin ───────────────────────────────────────────────────────
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_current_number_color "#{@thm_pink}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_right_separator ""

# ─── Keybinds ────────────────────────────────────────────────────────────────
bind -T prefix r source-file ~/.tmux.conf
bind -n M-r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-a
bind a send-prefix

# Splits
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind v split-window -h
# prefix+s was a duplicate -v split (redundant with prefix+-); repurposed as the
# session switcher -> the pretty sessions-only sessionx popup (same view the bottom
# pills open). Falls back to choose-tree -Zs if the picker script is missing.
bind s run-shell '[ -x ~/.local/share/tmux/session-picker.sh ] && ~/.local/share/tmux/session-picker.sh || tmux choose-tree -Zs'

# Smart pane switching with awareness of Neovim splits
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -l'"

setw -g mode-keys vi

# Vi copy mode: v=charwise, V=linewise (default), C-v=blockwise
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Pane zooming
bind o resize-pane -Z
bind z resize-pane -Z

# New window
bind c new-window

# Session nav: prefix+h/l cycle sessions (repeatable). Panes are moved with C-hjkl
# (root table, nvim-aware) so prefix+h/l select-pane was pure redundancy -- repurposed
# for the more common motion now that personal/fleet sessions are separate. j/k below
# stay pane-oriented (select + resize) since C-j/k already cover pane nav too but
# vertical select/resize by prefix is still handy.
bind -r h switch-client -p
bind -r l switch-client -n

# Pane select (prefix + jk vertical); pane nav primary path is C-hjkl (nvim-aware).
bind j select-pane -D
bind k select-pane -U

# Pane resizing (prefix + JK vertical; repeatable). H/L left free (session nav is
# lowercase now; horizontal resize via mouse-drag).
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
# prefix+b: jump to BASE (personal session) from anywhere. No-op with a toast if
# BASE is gone. Bare `tmux` inherits $TMUX so it hits the right socket.
bind b run-shell 'tmux has-session -t BASE 2>/dev/null && tmux switch-client -t BASE || tmux display-message "no BASE session"'

# Close tabs/panes
bind & kill-window
bind d kill-pane
bind x kill-pane

# SSH picker (prefix + S) — path is portable via ~
bind S display-popup -E -w 60% -h 60% "~/.local/share/tmux/ssh-picker.sh"

# Double-click pane to zoom/unzoom
bind-key -n DoubleClick1Pane resize-pane -Z

# Pane border labels (shows running command, tappable to select) — portable ~ path
set -g pane-border-status top
set -g pane-border-format "#(~/.local/share/tmux/pane-label.sh #{pane_pid} #{pane_index} #{pane_current_command})"
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#cba6f7"

# ─── TPM init (must run before status line references catppuccin vars) ───────
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# ─── Agent-pane plugins (local, not yet on GitHub) ───────────────────────────
# @plugin lines are for the eventual push; today the repos live under ~/projects
# and are symlinked into ~/.tmux/plugins, so source their entry points directly
# (tpm can only clone published repos). agent-flags chrome is OFF so it doesn't
# clobber catppuccin's window-status/status-right — flip @agentflags-color and
# @agentflags-summary on to merge them. The daemon still populates @agent_* which
# fleet consumes; tmux-inject provides safe queued injection.
set -g @plugin 'MichelKazi/tmux-agent-flags'
set -g @plugin 'MichelKazi/tmux-inject'
set -g @agentflags-color 'off'
set -g @agentflags-summary 'off'
run '~/.tmux/plugins/tmux-agent-flags/tmux-agent-flags.tmux'
run '~/.tmux/plugins/tmux-inject/tmux-inject.tmux'

# ─── OS-specific overrides (status line, rename format, continuum-boot) ───────
# Sourced after TPM so catppuccin vars exist. uname picks the right file.
if-shell 'uname | grep -q Darwin' \
  "source-file ~/gyatfiles/tmux/.tmux.macos.conf" \
  "source-file ~/gyatfiles/tmux/.tmux.steamos.conf"

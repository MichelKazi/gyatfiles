# --- 1) Change default prefix from Ctrl-b to Ctrl-a ---
unbind C-b
set -g prefix C-a
# Pressing prefix + a will “send-prefix,” letting you forward Ctrl-a if needed
bind a send-prefix

# --- 2) Splits ---
# WezTerm: LEADER + "-" => vertical split
bind - split-window -v

# WezTerm: LEADER + "_" => horizontal split
bind _ split-window -h

# WezTerm: LEADER + "s" => vertical split
bind s split-window -v

# WezTerm: LEADER + "v" => horizontal split
bind v split-window -h

# --- 3) Pane zooming ---
# WezTerm: LEADER + "o" or LEADER + "z" => toggle pane zoom
bind o resize-pane -Z
bind z resize-pane -Z

# --- 4) Creating a new tab (window in tmux) ---
# WezTerm: LEADER + "c" => new tab
bind c new-window

# --- 5) Pane navigation ---
# WezTerm: LEADER + "h"/"j"/"k"/"l" => move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 6) Pane resizing ---
# WezTerm: LEADER + SHIFT + H/J/K/L => resize panes
# The ‘-r’ flag allows repeat without pressing prefix again
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- 7) Tab (window) selection ---
# WezTerm: LEADER + 1..9 => switch to tabs 0..8
# Tmux windows are also zero-indexed by default.
bind 1 select-window -t 0
bind 2 select-window -t 1
bind 3 select-window -t 2
bind 4 select-window -t 3
bind 5 select-window -t 4
bind 6 select-window -t 5
bind 7 select-window -t 6
bind 8 select-window -t 7
bind 9 select-window -t 8

# --- 8) Closing tabs/panes ---
# WezTerm: LEADER + SHIFT + "&" => close current tab
bind & kill-window
# WezTerm: LEADER + "d"/"x" => close current pane
bind d kill-pane
bind x kill-pane

# --- 9) Optional: enable mouse support ---
# This allows clicking on panes, resizing them, switching windows by clicking on the status line, etc.
set -g mouse on

# --- 10) Notes on unmapped keys ---
# - WezTerm’s “key = '+', mods = 'SUPER', action = IncreaseFontSize” does not have a direct tmux equivalent.
# - If you’d like custom functionality for these, consider adding a run-shell or a script.

# Workspace navigation additions (nav prev/next, move+follow, number aliases).
# Named workspaces are defined by the letter binds in the main config.

# Cycle workspaces. bracketright/left = next/prev (also 2-finger touch gestures).
bindsym $mod+bracketright workspace next
bindsym $mod+bracketleft  workspace prev

# Move focused window to prev/next workspace and follow it.
bindsym $mod+Shift+bracketright move container to workspace next; workspace next
bindsym $mod+Shift+bracketleft  move container to workspace prev; workspace prev

# Number aliases for the named workspaces (muscle-memory fallback).
bindsym $mod+1 workspace Web
bindsym $mod+2 workspace Code
bindsym $mod+3 workspace Notes
bindsym $mod+4 workspace Design
bindsym $mod+5 workspace Messages
bindsym $mod+6 workspace Meetings
bindsym $mod+7 workspace Entertainment
bindsym $mod+8 workspace Private
bindsym $mod+9 workspace Scratch

bindsym $mod+Shift+1 move container to workspace Web; workspace Web
bindsym $mod+Shift+2 move container to workspace Code; workspace Code
bindsym $mod+Shift+3 move container to workspace Notes; workspace Notes
bindsym $mod+Shift+4 move container to workspace Design; workspace Design
bindsym $mod+Shift+5 move container to workspace Messages; workspace Messages
bindsym $mod+Shift+6 move container to workspace Meetings; workspace Meetings
bindsym $mod+Shift+7 move container to workspace Entertainment; workspace Entertainment
bindsym $mod+Shift+8 move container to workspace Private; workspace Private
bindsym $mod+Shift+9 move container to workspace Scratch; workspace Scratch

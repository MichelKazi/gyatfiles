[shell]
telemetry_enabled = false
setup_wizard_enabled = true
polkit_agent = false

[shell.panel]
transparency_mode = "soft"
borders = true
shadow = true

[osd.kinds]
power_profile = false

[brightness]
enable_ddcutil = false

[shell.session]
grid = false
show_shortcuts = true

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
command = "$HOME/.local/bin/scroll-to-gaming"
shortcut = "2"

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
variant = "destructive"
countdown_seconds = 5

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
variant = "destructive"
countdown_seconds = 5

[idle]
behavior_order = [ "dim", "screen-off", "suspend" ]

[idle.behavior.dim]
action = "custom"
enabled = true
timeout = 300.0
command = "$HOME/.local/bin/noctalia-dim dim"
resume_command = "$HOME/.local/bin/noctalia-dim undim"

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 600.0

# "custom" rather than the built-in suspend action because this must only fire
# on battery, and idle behaviors have no AC/battery condition.
[idle.behavior.suspend]
action = "custom"
enabled = true
timeout = 900.0
command = "$HOME/.local/bin/noctalia-idle-suspend"
resume_command = ""
